# DRT pipeline for wpf-test. See docs/drts-on-ci-implementation.md.
#
# Not run on every PR. Start it with a PR comment, `/azp run <pipeline name>`, or from the
# ADO "Run pipeline" dialog, where the filter parameters can be set.
#
# The DRTs run in one job per area (DrtList.xml Team attribute), so a failed area can be rerun
# on its own with "Rerun failed jobs".

trigger: none
pr: none

parameters:
- name: area
  displayName: Areas (comma-separated, exact names, blank for all)
  type: string
  default: ' '
- name: name
  displayName: Test name (QualityVault /Name=, substring, blank for all)
  type: string
  default: ' '
- name: rerunFailures
  displayName: Rerun failing DRTs once
  type: boolean
  default: true

variables:
- name: Build.Repository.Clean
  value: true

stages:
- template: /eng/pipelines/templates/drt-stages.yml
  parameters:
    area: ${{ parameters.area }}
    name: ${{ parameters.name }}
    rerunFailures: ${{ parameters.rerunFailures }}
