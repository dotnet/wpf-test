# Builds the tests and runs the MicroSuite feature tests on Azure DevOps build agents.
# See docs/drts-on-ci-implementation.md (MicroSuites). The Build stage splits the published tests
# into one payload per FeatureTests folder (New-TestPayload.ps1); the Test stage runs one job per
# payload, and each job downloads only its own payload.

parameters:
- name: configuration
  type: string
  default: Release
- name: platform
  type: string
  default: x64
- name: keywords
  type: string
  default: MicroSuite
# Comma-separated test areas, matched exactly, for example Controls,XamlV4. A single space means
# all areas: ADO needs a non-empty default to show the parameter in the Run pipeline dialog.
- name: area
  type: string
  default: ' '
# Rerun each failing test once. Some tests are timing-sensitive, for example
# AnimationMarkupTest(RectKeySplineBVT.xaml) failed once in three runs (build 1644447).
- name: rerunFailures
  type: boolean
  default: true
- name: pool
  type: object
  default:
    name: NetCore-Public
    demands: ImageOverride -equals windows.vs2026preview.scout.amd64.Open

stages:
- stage: Build
  displayName: Build tests
  jobs:
  - job: Build
    displayName: Build ${{ parameters.platform }} ${{ parameters.configuration }}
    timeoutInMinutes: 90
    pool: ${{ parameters.pool }}
    steps:
    - checkout: self
      clean: true

    - script: eng\scripts\CIBuild.cmd
        -configuration ${{ parameters.configuration }}
        -prepareMachine
        /p:Platform=${{ parameters.platform }}
      displayName: Build and publish tests

    # Discovers the tests, creates one payload per FeatureTests folder and sets the job matrix.
    - powershell: eng\scripts\New-TestPayload.ps1
        -Configuration ${{ parameters.configuration }}
        -Platform ${{ parameters.platform }}
        -Keywords '${{ parameters.keywords }}'
        -Area $env:TEST_AREA
        -OutputDirectory $(Build.ArtifactStagingDirectory)\TestPayload
        -OutputVariable matrix
      name: testMatrix
      displayName: Create test payloads
      env:
        TEST_AREA: ${{ parameters.area }}

    - task: PublishPipelineArtifact@1
      displayName: Publish test payloads
      inputs:
        path: $(Build.ArtifactStagingDirectory)\TestPayload
        artifactName: TestPayload_${{ parameters.platform }}_${{ parameters.configuration }}

    - task: PublishPipelineArtifact@1
      displayName: Publish build logs
      condition: always()
      inputs:
        path: $(Build.SourcesDirectory)\artifacts\log
        artifactName: BuildLogs_$(System.JobAttempt)

- stage: Test
  displayName: Run ${{ parameters.keywords }} tests
  dependsOn: Build
  jobs:
  - job: Test
    # ADO appends the matrix key (the payload) to the job name.
    displayName: ${{ parameters.keywords }} ${{ parameters.platform }} ${{ parameters.configuration }}
    timeoutInMinutes: 90
    pool: ${{ parameters.pool }}
    strategy:
      matrix: $[ stageDependencies.Build.Build.outputs['testMatrix.matrix'] ]
    variables:
      PayloadRoot: $(Pipeline.Workspace)\TestPayload
      QvRunDirectory: $(Agent.TempDirectory)\QualityVault\Run
    steps:
    # Only global.json and eng\common are needed, to install .NET.
    - checkout: self
      fetchDepth: 1

    - task: DownloadPipelineArtifact@2
      displayName: Download $(TestPayload) payload
      inputs:
        artifact: TestPayload_${{ parameters.platform }}_${{ parameters.configuration }}
        itemPattern: $(TestPayload)/**
        path: $(PayloadRoot)

    # The tests are framework-dependent and need the exact runtime from global.json.
    - powershell: |
        $ci = $true
        . eng\common\tools.ps1
        $null = InitializeDotNetCli -install:$true
        Write-Host "##vso[task.setvariable variable=TestDotNetRoot]$env:DOTNET_INSTALL_DIR"
      displayName: Install .NET from global.json

    - powershell: $(PayloadRoot)\$(TestPayload)\Invoke-Drts.ps1
        -TestRoot '$(PayloadRoot)\$(TestPayload)'
        -DiscoveryInfo DiscoveryInfo.xml
        -RunDirectory '$(QvRunDirectory)'
        -DotNetRoot '$(TestDotNetRoot)'
        -Keywords '${{ parameters.keywords }}'
        -Area '$(TestAreas)'
        -ExactArea
        -RerunFailures:$${{ parameters.rerunFailures }}
      displayName: Run $(TestAreas) tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: always()
      inputs:
        testResultsFormat: XUnit
        testResultsFiles: $(QvRunDirectory)\Report\testResults.xml
        testRunTitle: ${{ parameters.keywords }} $(TestPayload) ${{ parameters.platform }} ${{ parameters.configuration }} (attempt $(System.JobAttempt))
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true

    - task: PublishPipelineArtifact@1
      displayName: Publish test report
      condition: always()
      inputs:
        path: $(QvRunDirectory)\Report
        artifactName: TestReport_${{ parameters.platform }}_${{ parameters.configuration }}_$(TestPayload)_$(System.JobAttempt)